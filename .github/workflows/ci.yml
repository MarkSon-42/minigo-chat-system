name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: 코드 포맷팅 검증
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false  # Format check doesn't need cache

      - name: Check gofmt
        run: |
          # backend와 proxy 모두 체크
          unformatted=$(gofmt -l backend/ proxy/)
          if [ -n "$unformatted" ]; then
            echo "❌ The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "✅ All Go files are properly formatted"

  # Job 2: 백엔드 테스트
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend
          name: backend-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Job 3: 프록시 테스트
  test-proxy:
    name: Test Proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: proxy/go.sum

      - name: Run proxy tests
        working-directory: ./proxy
        run: |
          go mod download
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload proxy coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./proxy/coverage.out
          flags: proxy
          name: proxy-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Job 4: 빌드 검증
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, proxy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build ${{ matrix.module }}
        working-directory: ./${{ matrix.module }}
        run: |
          go mod download
          go build -v ./...
          echo "✅ ${{ matrix.module }} builds successfully"

  # Job 5: 전체 통합 (모든 Job이 성공해야 pass)
  all-checks:
    name: All Checks Passed
    needs: [format-check, test-backend, test-proxy, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.format-check.result }}" != "success" ]] || \
             [[ "${{ needs.test-backend.result }}" != "success" ]] || \
             [[ "${{ needs.test-proxy.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All checks passed!"
